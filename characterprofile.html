<header class="hero">


<div class="hero-content">


<h1 id="characterName">
Character
</h1>


<p>
Your Wippix identity
</p>


</div>


</header>





<main>



<section class="cards">



<div class="card">


<h2>
🧍 Character Preview
</h2>


<div class="character-image">

<p>
No image available yet.
</p>


</div>


</div>





<div class="card">


<h2>
Character Information
</h2>


<p id="characterClass">

Class:

</p>


<p id="characterRank">

Rank:

</p>


</div>




</section>





<section class="update-card">


<h2>
Customization
</h2>


<p>

👕 Clothing

<br>

🎩 Hats

<br>

🕶 Accessories

<br>

🎨 Appearance


</p>


<button>
Customize Character
</button>


</section>





<button onclick="backAccount()">

Back to Account

</button>



</main>







<script>


let name =
localStorage.getItem("characterName");


let characterClass =
localStorage.getItem("characterClass");


let rank =
localStorage.getItem("horizonRank");



if(name == null){

window.location.href="character.html";

}




document.getElementById("characterName").innerHTML =
name;



document.getElementById("characterClass").innerHTML =
"Class: " + characterClass;



document.getElementById("characterRank").innerHTML =
"Rank: " + rank;





function backAccount(){

window.location.href="account.html";

}



</script>
