<!DOCTYPE html>

</head>


<body>


<nav>

<h2>Horizon</h2>

<div>

</nav>



<header>

<h1 id="characterName">
Character
</h1>

<p id="characterImage">

</p>

<main>

<h2>Character Info</h2>


<p id="characterClass">
Class:
</p>


<p id="characterRank">
Rank:
</p>


<br>


<button onclick="backAccount()">
Back to Account
</button>


</main>



<script>


let name = localStorage.getItem("characterName");

let characterClass = localStorage.getItem("characterClass");

let rank = localStorage.getItem("horizonRank");



if(name == null){

window.location.href="character.html";

}



document.getElementById("characterName").innerHTML =
name;



document.getElementById("characterClass").innerHTML =
"Class: " + characterClass;



document.getElementById("characterRank").innerHTML =
"Rank: " + rank;



function backAccount(){

window.location.href="account.html";

}


</script>
