<!DOCTYPE html>
<html>

<head>
    <title>Horizon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
   <img src="Images/Horizon-logo.png" class="logo">

    <div>
        <a href="index.html">Home</a>
        <a href="devlog.html">Dev Log</a>
        <a href="game.html">Game</a>
        <a id="navAccount" href="signin.html">Sign In</a>
        <a href="download.html">Download</a>
    </div>
</nav>


<header>
    <h1>Horizon</h1>
    <p>Explore. Discover. Survive.</p>
</header>


<main>

<h2>Welcome to Horizon</h2>

<p>
A new adventure is being created.
Follow the development of Horizon.
</p>


<a id="homeButton" href="signin.html">
    <button>Sign In</button>
</a>


<a id="createButton" href="create.html">
    <button>Create Account</button>
</a>


<div id="welcomeMessage"></div>


<h2>Latest Development</h2>

<p>
Pre-Alpha 0.0.1<br>
Terrain, forests, mountains, movement and more!
</p>

</main>


<script>

let loggedIn = localStorage.getItem("horizonLoggedIn");
let username = localStorage.getItem("horizonUsername");


let accountLink = document.getElementById("navAccount");
let homeButton = document.getElementById("homeButton");
let createButton = document.getElementById("createButton");
let welcomeMessage = document.getElementById("welcomeMessage");



if(loggedIn === "true" && username) {


    // Change navbar Sign In -> Account
    if(accountLink){
        accountLink.innerHTML = "Account";
        accountLink.href = "account.html";
    }



    // Change main Sign In button -> Account
    if(homeButton){
        homeButton.innerHTML = "<button>Account</button>";
        homeButton.href = "account.html";
    }



    // Hide Create Account button
    if(createButton){
        createButton.style.display = "none";
    }



    // Show welcome message
    if(welcomeMessage){
        welcomeMessage.innerHTML =
        "<h2>Welcome back, " + username + "!</h2>";
    }

}

</script>


</body>
</html>
