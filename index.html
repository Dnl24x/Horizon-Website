<!DOCTYPE html>
<html>

<head>

    <title>Horizon</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- Navigation -->

<nav>

    <a href="index.html">
        <img src="Images/Horizon-logo.png" class="logo">
    </a>


    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="game.html">Game</a>

        <a href="devlog.html">Dev Log</a>

        <a href="download.html">Download</a>

        <a id="navAccount" href="signin.html">
            Sign In
        </a>

    </div>


</nav>




<!-- Hero -->

<header class="hero">


    <div class="hero-content">

        <h1>Horizon</h1>

        <p>
            Explore. Discover. Survive.
        </p>


        <div class="hero-buttons">

            <a id="homeButton" href="signin.html">
                <button>
                    Play Horizon
                </button>
            </a>


            <a id="createButton" href="create.html">
                <button class="secondary">
                    Create Account
                </button>
            </a>

        </div>


    </div>


</header>





<!-- Main Content -->


<main>


<section class="intro">


<h2>
Welcome to Horizon
</h2>


<p>
A new adventure is being created.
Follow the development of Horizon.
</p>


<div id="welcomeMessage"></div>


</section>





<section class="update-card">


<h2>
Latest Development
</h2>


<p>
<b>Pre-Alpha 0.0.1</b>
</p>


<p>
Terrain, forests, mountains,
movement and more!
</p>


</section>



</main>





<script>


let loggedIn = localStorage.getItem("horizonLoggedIn");

let username = localStorage.getItem("horizonUsername");



let accountLink =
document.getElementById("navAccount");


let homeButton =
document.getElementById("homeButton");


let createButton =
document.getElementById("createButton");


let welcomeMessage =
document.getElementById("welcomeMessage");





if(loggedIn === "true" && username){


    accountLink.innerHTML = "Account";

    accountLink.href = "account.html";



    homeButton.innerHTML =
    "<button>Account</button>";

    homeButton.href =
    "account.html";



    createButton.style.display = "none";



    welcomeMessage.innerHTML =
    "<h2>Welcome back, " + username + "!</h2>";

}


</script>



</body>

</html>
