<title>Wippix</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>



<nav>


<a href="index.html">

<img src="Images/Wippix-logo.png" class="logo">

</a>



<div class="nav-links">


<a href="index.html">
Home
</a>


<a href="vehicles.html">
Vehicles
</a>


<a href="maps.html">
Maps
</a>


<a href="characters.html">
Characters
</a>


<a href="features.html">
Features
</a>


<a href="devlog.html">
Dev Log
</a>


</div>



<div class="nav-right">


<a id="accountLink" href="signin.html">

Sign In

</a>


</div>



</nav>







<!-- Logged out page -->


<section id="landingPage" class="landing">



<div class="landing-content">


<h1>

WIPPIX

</h1>



<p>

A new generation of driving and worlds.

</p>




<div>


<a href="signin.html">

<button>

Sign In

</button>

</a>



<a href="create-account.html">

<button class="secondary">

Create Account

</button>

</a>


</div>



</div>



</section>







<!-- Logged in dashboard -->


<section id="dashboardPage" style="display:none;">





<header class="dashboard-header">


<h1 id="welcome">

Welcome

</h1>


<p>

Your Wippix profile

</p>


</header>







<main>



<section class="profile-section">



<div class="character-box">


<div class="character-placeholder">


Character Coming Soon


</div>


</div>





<div class="profile-info">


<h2 id="username">

</h2>


<p id="rank">

</p>



<a href="characters.html">

<button>

Characters

</button>

</a>



</div>



</section>








<section class="dashboard-section">


<h2>

Vehicles

</h2>


<p>

Your owned vehicles will appear here.

</p>


<a href="vehicles.html">

<button>

View Vehicles

</button>

</a>


</section>








<section class="dashboard-section">


<h2>

Maps

</h2>


<p>

Explore available worlds.

</p>


<a href="maps.html">

<button>

View Maps

</button>

</a>


</section>






</main>



</section>









<script>



let loggedIn =
localStorage.getItem("wippixLoggedIn");



let username =
localStorage.getItem("wippixUsername");





let landing =
document.getElementById("landingPage");


let dashboard =
document.getElementById("dashboardPage");


let account =
document.getElementById("accountLink");






if(loggedIn === "true" && username){



landing.style.display =
"none";



dashboard.style.display =
"block";



account.innerHTML =
"Account";


account.href =
"account.html";




document.getElementById("welcome").innerHTML =
"Welcome back, " + username;



document.getElementById("username").innerHTML =
username;



document.getElementById("rank").innerHTML =
"Rank: " +
(localStorage.getItem("wippixRank") || "PLAYER");



}



</script>





</body>

</html>
