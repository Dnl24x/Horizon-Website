<!DOCTYPE html>
<html>

<head>

<title>Character Customization - Wippix</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav>

<a href="index.html">

<img src="Images/Wippix-logo.png" class="logo">

</a>


<div class="nav-links">

<a href="index.html">Home</a>

<a href="vehicles.html">Vehicles</a>

<a href="maps.html">Maps</a>

<a href="features.html">Features</a>

<a href="devlog.html">Dev Log</a>

</div>


<div class="nav-right">

<a href="account.html">
Account
</a>

</div>


</nav>





<header class="dashboard-header">

<h1>
Customize Character
</h1>

<p>
Create your Wippix identity.
</p>

</header>





<main>


<section class="character-creator">



<!-- Character Preview -->

<div class="character-preview">


<h2>
Character Preview
</h2>


<div class="character-model">

Image Coming Soon

</div>


<h3 id="characterName">
document.getElementById("characterName").innerHTML =
localStorage.getItem("wippixCharacterName") || "Player";
</h3>


</div>





<!-- Customization -->

<div class="customization-panel">


<h2>
Customization
</h2>



<div class="custom-tabs">


<button onclick="showCategory('hair')">
Hair
</button>


<button onclick="showCategory('clothes')">
Clothes
</button>


<button onclick="showCategory('shoes')">
Shoes
</button>


<button onclick="showCategory('skin')">
Skin Tone
</button>


<button onclick="showCategory('accessories')">
Accessories
</button>


</div>





<div id="customOptions">



</div>



</div>



</section>



</main>






<script>


let username =
localStorage.getItem("wippixUsername");


document.getElementById("characterName").innerHTML =
username || "Player";





function showCategory(type){


let box =
document.getElementById("customOptions");



let title =
type.charAt(0).toUpperCase() + type.slice(1);



box.innerHTML =

`

<h2>${title}</h2>

<div class="option-grid">


<div class="option-card">
Image Coming Soon
<br>
${title} Style 1
</div>


<div class="option-card">
Image Coming Soon
<br>
${title} Style 2
</div>


<div class="option-card">
Image Coming Soon
<br>
${title} Style 3
</div>


<div class="option-card">
Image Coming Soon
<br>
${title} Style 4
</div>


<div class="option-card">
Image Coming Soon
<br>
${title} Style 5
</div>


<div class="option-card">
Image Coming Soon
<br>
${title} Style 6
</div>


</div>

`;



}



showCategory("hair");



</script>




</body>

</html>
