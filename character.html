<header>
    <h1>Create Character</h1>
    <p>Your journey begins here.</p>
</header>



<main>


<h2>Choose your name</h2>

<input id="characterName" placeholder="Character name">


<br><br>


<h2>Select class</h2>


<select id="characterClass">

<option>Explorer</option>
<option>Survivor</option>
<option>Builder</option>
<option>Developer</option>

</select>


<br><br>


<button onclick="createCharacter()">
Create Character
</button>


<p id="message"></p>


</main>




<script>


function createCharacter(){


let name = document.getElementById("characterName").value;

let characterClass = document.getElementById("characterClass").value;



if(name === ""){

    document.getElementById("message").innerHTML =
    "Please enter a character name!";

    return;

}



// Save character

localStorage.setItem(
"horizonCharacter",
"true"
);


localStorage.setItem(
"characterName",
name
);


localStorage.setItem(
"characterClass",
characterClass
);



// Send to character profile

window.location.href = "characterprofile.html";


}



</script>
