<header>
<h1>Create Account</h1>
</header>


<main>

<input id="username" placeholder="Username">

<br><br>

<input id="password" placeholder="Password" type="password">

<br><br>

<button onclick="createAccount()">Create Account</button>

<p id="message"></p>

</main>


<script src="script.js"></script>


<script>

function createAccount(){

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;


if(username === "" || password === ""){
    document.getElementById("message").innerHTML =
    "Please enter username and password";

    return;
}


localStorage.setItem("horizonUsername", username);
if(username === "Dnl24x"){

localStorage.setItem("horizonRank","OWNER");

localStorage.setItem("characterName","DEVDnl24x");

localStorage.setItem("characterClass","Developer");

}
else{

localStorage.setItem("horizonRank","PLAYER");

}
localStorage.setItem("horizonPassword", password);
localStorage.setItem("horizonLoggedIn", "true");


// Rank system
if(username === "Dnl24x"){
    localStorage.setItem("horizonRank", "OWNER");
}
else if(username === "DevNameHere"){
    localStorage.setItem("horizonRank", "DEV");
}
else{
    localStorage.setItem("horizonRank", "PLAYER");
}


window.location.href = "account.html";

}

</script>
