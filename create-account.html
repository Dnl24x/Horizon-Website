</head>


<body>


<nav>

</a>


<div class="nav-links">

Home
</a>

Sign In
</a>

</div>


</nav>






<header class="dashboard-header">


<h1>
Create Account
</h1>


<p>
Create your Wippix profile.
</p>


</header>






<main>



<section class="dashboard-section">



<input 
id="username"
placeholder="Username"
>



<br><br>



<input 
id="password"
placeholder="Password"
type="password"
>



<br><br>



<button onclick="createAccount()">

Create Account

</button>



<p id="message"></p>



</section>



</main>






<script>


function createAccount(){



let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;




if(username === "" || password === ""){


document.getElementById("message").innerHTML =
"Please enter username and password";


return;


}




localStorage.setItem(
"wippixUsername",
username
);



localStorage.setItem(
"wippixPassword",
password
);





if(username === "Dnl24x"){


localStorage.setItem(
"wippixRank",
"OWNER"
);


}

else {


localStorage.setItem(
"wippixRank",
"PLAYER"
);


}






localStorage.setItem(
"wippixLoggedIn",
"true"
);





window.location.href =
"index.html";



}



</script>

</html>
