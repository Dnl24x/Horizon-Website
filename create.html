<!DOCTYPE html>
<html>

<head>
<title>Create Account - Horizon</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h2>Horizon</h2>

<div>
<a href="index.html">Home</a>
<a href="signin.html">Sign In</a>
</div>

</nav>


<header>
<h1>Create Account</h1>
</header>


<main>

<input id="username" placeholder="Username">

<br><br>

<input id="password" placeholder="Password" type="password">

<br><br>

<button onclick="createAccount()">Create Account</button>

<p id="message"></p>

</main>


<script src="script.js"></script>


<script>

function createAccount(){

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;


if(username === "" || password === ""){
    document.getElementById("message").innerHTML =
    "Please enter username and password";

    return;
}


localStorage.setItem("horizonUsername", username);
localStorage.setItem("horizonPassword", password);
localStorage.setItem("horizonLoggedIn", "true");


// Rank system
if(username === "Dnl24x"){
    localStorage.setItem("horizonRank", "OWNER");
}
else if(username === "DevNameHere"){
    localStorage.setItem("horizonRank", "DEV");
}
else{
    localStorage.setItem("horizonRank", "PLAYER");
}


window.location.href = "account.html";

}

</script>


</body>
</html>
