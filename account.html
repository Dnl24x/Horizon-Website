<!DOCTYPE html>
<html>

<head>
<title>Horizon Account</title>
<link rel="stylesheet" href="style.css">
</head>


<body>


<nav>
<img src="Images/Horizon-logo.png" class="logo">

<div>
<a href="index.html">Home</a>
<a href="game.html">Game</a>
<a href="download.html">Download</a>
<a href="account.html">Account</a>
</div>

</nav>



<header>
<h1>Welcome to Horizon</h1>
<p id="username"></p>
</header>



<main>


<h2 id="rank"></h2>


<h2>Your Account</h2>


<p id="characterStatus">
Character: Not created yet
</p>


<a id="characterButton" href="character.html">
<button>Create Character</button>
</a>


<br><br>


<button>
Play Horizon
</button>


<br><br>


<button onclick="logout()">
Log Out
</button>



</main>




<script>


let user = localStorage.getItem("horizonUsername");


if(user == null){

window.location.href="signin.html";

}



document.getElementById("username").innerHTML =
"Welcome back, " + user + "!";




// Rank system

let rank = localStorage.getItem("horizonRank");


if(rank == null){

    if(user === "Dnl24x"){

        rank="OWNER";

    } else {

        rank="PLAYER";

    }


    localStorage.setItem("horizonRank", rank);

}


document.getElementById("rank").innerHTML =
"Rank: " + rank;





// Character system

let hasCharacter = localStorage.getItem("horizonCharacter");

let characterName = localStorage.getItem("characterName");

let characterClass = localStorage.getItem("characterClass");



if(hasCharacter === "true"){


document.getElementById("characterStatus").innerHTML =
"Character: " + characterName +
"<br>Class: " + characterClass;



document.getElementById("characterButton").style.display="none";


}





function logout(){


localStorage.removeItem("horizonLoggedIn");
localStorage.removeItem("horizonUsername");
localStorage.removeItem("horizonPassword");
localStorage.removeItem("horizonRank");


window.location.href="signin.html";


}



</script>


</body>

</html>
