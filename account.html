<!DOCTYPE html>
<html>

<head>

<title>Wippix Account</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav>

<a href="index.html">
<img src="Images/Horizon-logo.png" class="logo">
</a>


<div class="nav-links">

<a href="index.html">Home</a>
<a href="game.html">Game</a>
<a href="vehicles.html">Vehicles</a>
<a href="maps.html">Maps</a>
<a href="characters.html">Characters</a>
<a href="features.html">Features</a>
<a href="devlog.html">Dev Log</a>
<a href="download.html">Download</a>

</div>


<div class="nav-right">

<input class="search" placeholder="Search Wippix...">

<a href="account.html">
Account
</a>

</div>


</nav>




<header class="hero">

<div class="hero-content">

<h1>
Player Profile
</h1>

<p id="username">
</p>

</div>

</header>





<main>


<section class="update-card">


<h2 id="rank">
Rank
</h2>


<p>
Welcome to your Wippix profile.
</p>


</section>





<section class="cards">


<div class="card">


<h2>
🧍 Character
</h2>


<p id="characterStatus">
No character created.
</p>


<a id="characterButton" href="character.html">

<button>
Create Character
</button>

</a>


</div>





<div class="card">


<h2>
🚗 Vehicles
</h2>


<p>
No vehicles unlocked yet.
</p>


</div>





<div class="card">


<h2>
⭐ Progress
</h2>


<p>

Level: 1

<br><br>

Experience: 0 XP

</p>


</div>



</section>





<br>


<button onclick="logout()">
Log Out
</button>



</main>






<script>


let user =
localStorage.getItem("horizonUsername");


if(!user){

window.location.href="signin.html";

}



document.getElementById("username").innerHTML =
"Welcome back, " + user;




let rank =
localStorage.getItem("horizonRank");



document.getElementById("rank").innerHTML =
"Rank: " + rank;




let character =
localStorage.getItem("horizonCharacter");


let characterName =
localStorage.getItem("characterName");


let characterClass =
localStorage.getItem("characterClass");



if(character === "true"){


document.getElementById("characterStatus").innerHTML =

characterName +

"<br>" +

"Class: " +

characterClass;



document.getElementById("characterButton").style.display="none";


}





function logout(){


localStorage.removeItem("horizonLoggedIn");

localStorage.removeItem("horizonUsername");

localStorage.removeItem("horizonPassword");


window.location.href="signin.html";


}



</script>


</body>

</html>
