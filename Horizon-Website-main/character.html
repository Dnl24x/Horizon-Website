</head>


<body>


<nav>

</nav>







<header class="dashboard-header">


<h1>
Create Character
</h1>


<p>
Create your Wippix identity.
</p>


</header>







<main>



<section class="profile-section">


<div class="character-box">


<div class="character-placeholder">

Character Preview Coming Soon

</div>


</div>



<div class="profile-info">


<h2>
New Character
</h2>


<p>
Customize your appearance in the future.
</p>


</div>



</section>








<section class="dashboard-section">


<h2>
Character Name
</h2>


<input 
id="characterName"
placeholder="Character name"
>


</section>








<section class="dashboard-section">


<h2>
Starting Style
</h2>



<select id="characterStyle">


<option>
Driver
</option>


<option>
Explorer
</option>


<option>
Creator
</option>


<option>
Developer
</option>


</select>



</section>








<button onclick="createCharacter()">

Create Character

</button>



<p id="message"></p>



</main>







<script>


function createCharacter(){



let name =
document.getElementById("characterName").value;



let style =
document.getElementById("characterStyle").value;




if(name === ""){


document.getElementById("message").innerHTML =
"Please enter a character name.";


return;


}




localStorage.setItem(
"wippixCharacter",
"true"
);



localStorage.setItem(
"wippixCharacterName",
name
);



localStorage.setItem(
"wippixCharacterStyle",
style
);





window.location.href =
"characters.html";



}



</script>



</body>

</html>
